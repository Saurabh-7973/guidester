name: Feature request
description: Something Guidester should do for your testers or your team.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, in terms of your testers or your team, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: now
    attributes:
      label: What do you do today instead?
