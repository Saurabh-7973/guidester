# Repository-wide analysis settings.
#
# Stricter than the flutter_lints default on purpose: this is a public package
# that other people may contribute to, and the compiler is cheaper than review.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Warnings that are almost always real defects are errors here.
    unawaited_futures: error
    invalid_use_of_visible_for_testing_member: error
    deprecated_member_use: warning
    todo: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
